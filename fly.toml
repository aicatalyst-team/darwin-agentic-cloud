# fly.toml — Darwin Agentic Cloud deployment config.
#
# Deploy:        fly deploy
# Logs:          fly logs
# Status:        fly status
# Open the URL:  fly open

app = "darwin-agentic-cloud"
primary_region = "ord"            # Chicago — closest to your East Hartford location

[build]
  dockerfile = "Dockerfile"

[env]
  DARWIN_STATE_DIR = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "darwin_data"
  destination = "/data"
  initial_size = "1gb"
