# Cron-driven loop that re-prompts Copilot Cloud Agent every 6 hours
# until the linked outreach meta-issue is closed.
#
# When the meta-issue is open and hasn't been commented on by Copilot
# in the last 6 hours, this workflow adds a fresh "@copilot continue"
# comment to wake the agent back up.
#
# The meta-issue's number must be configured as repository variable
# AGENT_OUTREACH_ISSUE.

name: Outreach loop

on:
  schedule:
    # Every 6 hours at minute 7 (offset to avoid GitHub Actions
    # scheduling congestion at :00).
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you triggering this manually?"
        required: false
        default: "manual nudge"

permissions:
  contents: read
  issues: write

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve outreach issue number
        id: cfg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE="${{ vars.AGENT_OUTREACH_ISSUE }}"
          if [ -z "$ISSUE" ]; then
            echo "::warning::AGENT_OUTREACH_ISSUE variable not set; skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "issue=$ISSUE" >> $GITHUB_OUTPUT

      - name: Check issue state and last activity
        id: state
        if: steps.cfg.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.cfg.outputs.issue }}
        run: |
          STATE=$(gh issue view "$ISSUE" --repo ${{ github.repository }} --json state -q .state)
          echo "state=$STATE" >> $GITHUB_OUTPUT
          if [ "$STATE" != "OPEN" ]; then
            echo "Issue not open; nothing to nudge."
            exit 0
          fi
          # Get the timestamp of the most recent comment by anyone
          LAST=$(gh issue view "$ISSUE" --repo ${{ github.repository }} \
            --json comments -q '.comments | sort_by(.createdAt) | last | .createdAt')
          if [ -z "$LAST" ] || [ "$LAST" = "null" ]; then
            # No comments yet, definitely need to wake the agent
            echo "needs_nudge=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          NOW=$(date -u +%s)
          LAST_TS=$(date -u -d "$LAST" +%s 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$LAST" +%s)
          DELTA=$(( NOW - LAST_TS ))
          # 5.5 hours = 19800 seconds (slightly less than 6h to handle clock drift)
          if [ "$DELTA" -gt 19800 ]; then
            echo "needs_nudge=true" >> $GITHUB_OUTPUT
          else
            echo "Last activity $DELTA seconds ago; no nudge needed."
            echo "needs_nudge=false" >> $GITHUB_OUTPUT
          fi

      - name: Nudge Copilot
        if: steps.state.outputs.needs_nudge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.cfg.outputs.issue }}
        run: |
          gh issue comment "$ISSUE" --repo ${{ github.repository }} --body \
            "@copilot continue working on the outreach loop. Pick the next unchecked task above and proceed per the try/fail/retry rules. Cycle: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
